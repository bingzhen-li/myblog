title: "我的博客"
name: "我的博客"
description: "基于 Jekyll 和 Minimal Mistakes 的个人博客。"
url: "https://example.com"
baseurl: ""
repository: "bingzhen-li/myblog"
locale: zh-CN
timezone: Asia/Shanghai
minimal_mistakes_skin: default
masthead_title: "我的博客"
words_per_minute: 200
date_format: "%Y年%m月%d日"
breadcrumbs: true
search: true
search_full_content: true
search_provider: lunr

theme: minimal-mistakes-jekyll

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-paginate

paginate: 5
paginate_path: /page:num/

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      show_date: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
      breadcrumbs: true

author: "BZLI"

social:
  type: Person
  name: "BZLI"
  links:
    - https://github.com/bingzhen-li

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /categories/

exclude:
  - .gitignore
  - README.md
  - .bundle/
  - .jekyll-cache/
  - vendor/
